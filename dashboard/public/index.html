<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader{border:3px solid #374151;border-top-color:#3b82f6;border-radius:50%;width:18px;height:18px;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .tab-active{border-bottom:2px solid #3b82f6;color:#3b82f6;font-weight:600}
    .log-line{font-family:monospace;font-size:12px;padding:2px 0;border-bottom:1px solid #1f2937}
    .log-err{color:#f87171}
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-sm">TB</div>
      <h1 class="text-xl font-semibold">Testing Bot Dashboard</h1>
      <span class="text-xs bg-green-600/20 text-green-400 px-2 py-0.5 rounded">LIVE</span>
    </div>
    <div class="flex items-center gap-2 text-sm text-gray-400">
      <span class="w-2 h-2 rounded-full bg-green-500" id="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <div class="flex border-b border-gray-800 px-6 pt-4 gap-6 text-sm">
    <button class="tab pb-3 tab-active" data-tab="trigger" onclick="switchTab('trigger')">Trigger Test</button>
    <button class="tab pb-3 text-gray-500 hover:text-gray-300" data-tab="runs" onclick="switchTab('runs')">Runs & Logs</button>
  </div>

  <main class="px-6 py-6 max-w-7xl mx-auto">

    <!-- Trigger Tab -->
    <div id="tab-trigger">
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="bg-gray-900 rounded-xl p-6 border border-gray-800">
          <h2 class="text-lg font-semibold mb-4">Trigger Bot</h2>

          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Repository</label>
            <div class="flex gap-2">
              <select id="repo-select" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" onchange="onRepoSelect()">
                <option value="">Loading repos...</option>
              </select>
              <button onclick="loadRepos()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm hover:bg-gray-700">Refresh</button>
            </div>
            <p class="text-xs text-gray-600 mt-2">Or enter manually:</p>
            <div class="flex gap-2 mt-1">
              <input id="repo-owner" placeholder="owner" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
              <span class="text-gray-600 self-center">/</span>
              <input id="repo-name" placeholder="repo" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Test Mode</label>
            <div class="flex gap-4">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="pr" checked onchange="toggleMode()" class="accent-blue-500">
                <span class="text-sm">Specific PR</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="full" onchange="toggleMode()" class="accent-blue-500">
                <span class="text-sm">Full App Test</span>
              </label>
            </div>
          </div>

          <div id="pr-section" class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Pull Request</label>
            <div class="flex gap-2">
              <select id="pr-select" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
                <option value="">Select repo first...</option>
              </select>
              <input id="pr-number" type="number" placeholder="PR #" class="w-24 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
            </div>
          </div>

          <div id="branch-section" class="mb-4 hidden">
            <label class="block text-sm text-gray-400 mb-1">Branch</label>
            <input id="branch-input" value="main" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
          </div>

          <button id="trigger-btn" onclick="triggerBot()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors mt-2">
            Run Tests
          </button>
          <div id="trigger-result" class="mt-3 text-sm hidden"></div>
        </div>

        <!-- Live Logs Panel -->
        <div class="bg-gray-900 rounded-xl p-6 border border-gray-800 flex flex-col">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-semibold">Live Logs</h2>
            <span id="live-status" class="text-xs text-gray-500">No active run</span>
          </div>
          <div id="live-logs" class="flex-1 bg-gray-950 rounded-lg p-3 overflow-y-auto max-h-[500px] min-h-[300px] text-xs font-mono text-gray-400">
            <p class="text-gray-600">Trigger a test to see live logs here...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Runs Tab -->
    <div id="tab-runs" class="hidden">
      <div class="grid lg:grid-cols-3 gap-6">
        <!-- Run List -->
        <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
          <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="font-semibold">All Runs</h2>
            <button onclick="loadRuns()" class="text-sm text-blue-400 hover:text-blue-300">Refresh</button>
          </div>
          <div id="runs-list" class="divide-y divide-gray-800 max-h-[600px] overflow-y-auto">
            <div class="p-8 text-center text-gray-500">No runs yet</div>
          </div>
        </div>

        <!-- Selected Run Logs -->
        <div class="lg:col-span-2 bg-gray-900 rounded-xl border border-gray-800 overflow-hidden flex flex-col">
          <div class="p-4 border-b border-gray-800">
            <h2 class="font-semibold" id="selected-run-title">Select a run to view logs</h2>
          </div>
          <div id="selected-run-logs" class="flex-1 p-4 overflow-y-auto max-h-[600px] bg-gray-950 font-mono text-xs text-gray-400">
            <p class="text-gray-600">Click on a run from the list</p>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
let activeRunId = null;
let logPollInterval = null;

function switchTab(tab){
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(el=>{el.classList.remove('tab-active');el.classList.add('text-gray-500')});
  document.getElementById('tab-'+tab).classList.remove('hidden');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('tab-active');
  document.querySelector(`[data-tab="${tab}"]`).classList.remove('text-gray-500');
  if(tab==='runs')loadRuns();
}

function toggleMode(){
  const mode=document.querySelector('input[name="mode"]:checked').value;
  document.getElementById('pr-section').classList.toggle('hidden',mode==='full');
  document.getElementById('branch-section').classList.toggle('hidden',mode==='pr');
}

async function api(path,opts){return(await fetch('/api'+path,opts)).json();}

async function loadRepos(){
  const sel=document.getElementById('repo-select');
  try{
    const repos=await api('/repos');
    if(repos.error){sel.innerHTML=`<option value="">${repos.error}</option>`;return;}
    sel.innerHTML='<option value="">Select a repo...</option>';
    repos.forEach(r=>{
      sel.innerHTML+=`<option value="${r.owner}/${r.name}" data-owner="${r.owner}" data-name="${r.name}" data-branch="${r.defaultBranch}">${r.fullName}${r.private?' (private)':''}</option>`;
    });
    document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-green-500';
    document.getElementById('status-text').textContent='Connected';
  }catch{
    sel.innerHTML='<option value="">Failed to load</option>';
    document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-red-500';
    document.getElementById('status-text').textContent='Error';
  }
}

async function onRepoSelect(){
  const opt=document.getElementById('repo-select').selectedOptions[0];
  if(!opt||!opt.dataset.owner)return;
  document.getElementById('repo-owner').value=opt.dataset.owner;
  document.getElementById('repo-name').value=opt.dataset.name;
  document.getElementById('branch-input').value=opt.dataset.branch||'main';
  const prSel=document.getElementById('pr-select');
  prSel.innerHTML='<option value="">Loading PRs...</option>';
  try{
    const pulls=await api(`/pulls?owner=${opt.dataset.owner}&repo=${opt.dataset.name}`);
    prSel.innerHTML='<option value="">Select a PR...</option>';
    if(Array.isArray(pulls))pulls.forEach(pr=>{prSel.innerHTML+=`<option value="${pr.number}">#${pr.number} — ${pr.title} (${pr.branch})</option>`;});
  }catch{prSel.innerHTML='<option value="">Failed</option>';}
}

async function triggerBot(){
  const owner=document.getElementById('repo-owner').value.trim();
  const name=document.getElementById('repo-name').value.trim();
  if(!owner||!name)return alert('Select or enter a repository');

  const mode=document.querySelector('input[name="mode"]:checked').value;
  const prNumber=mode==='pr'?(document.getElementById('pr-select').value||document.getElementById('pr-number').value||null):null;
  const branch=mode==='full'?document.getElementById('branch-input').value:undefined;

  const btn=document.getElementById('trigger-btn');
  const result=document.getElementById('trigger-result');
  btn.disabled=true;
  btn.innerHTML='<span class="loader"></span> Starting bot...';

  try{
    const data=await api('/trigger',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({repoOwner:owner,repoName:name,prNumber:prNumber?Number(prNumber):undefined,branch}),
    });

    if(data.error){
      result.className='mt-3 text-sm text-red-400';result.textContent=data.error;
    }else{
      result.className='mt-3 text-sm text-green-400';result.textContent=data.message;
      if(data.runId) startLogPolling(data.runId);
    }
    result.classList.remove('hidden');
    btn.innerHTML='Run Tests';btn.disabled=false;
  }catch{
    result.className='mt-3 text-sm text-red-400';result.textContent='Failed';
    result.classList.remove('hidden');btn.innerHTML='Run Tests';btn.disabled=false;
  }
}

function startLogPolling(runId){
  activeRunId=runId;
  const logsDiv=document.getElementById('live-logs');
  const statusEl=document.getElementById('live-status');
  logsDiv.innerHTML='';
  statusEl.innerHTML='<span class="loader"></span> Running...';
  statusEl.className='text-xs text-blue-400';

  if(logPollInterval)clearInterval(logPollInterval);
  let lastCount=0;

  logPollInterval=setInterval(async()=>{
    try{
      const data=await api(`/runs/${runId}/logs`);
      // Append only new logs
      const newLogs=data.logs.slice(lastCount);
      newLogs.forEach(line=>{
        const div=document.createElement('div');
        div.className='log-line'+(line.includes('[ERR]')?' log-err':'');
        div.textContent=line;
        logsDiv.appendChild(div);
      });
      lastCount=data.logs.length;
      logsDiv.scrollTop=logsDiv.scrollHeight;

      if(data.status==='completed'){
        clearInterval(logPollInterval);logPollInterval=null;
        if(data.conclusion==='success'){
          statusEl.textContent='COMPLETED';statusEl.className='text-xs text-green-400 font-semibold';
        }else{
          statusEl.textContent='FAILED';statusEl.className='text-xs text-red-400 font-semibold';
        }
      }
    }catch{}
  },1000);
}

async function loadRuns(){
  const container=document.getElementById('runs-list');
  try{
    const runs=await api('/runs');
    if(!Array.isArray(runs)||runs.length===0){container.innerHTML='<div class="p-8 text-center text-gray-500">No runs yet</div>';return;}

    container.innerHTML=runs.map(r=>{
      let sc='text-gray-400',sb='bg-gray-800',st=r.status;
      if(r.status==='completed'&&r.conclusion==='success'){sc='text-green-400';sb='bg-green-900/30';st='PASSED';}
      else if(r.status==='completed'&&r.conclusion==='failure'){sc='text-red-400';sb='bg-red-900/30';st='FAILED';}
      else if(r.status==='in_progress'){sc='text-blue-400';sb='bg-blue-900/30';st='RUNNING';}

      return `<div class="px-4 py-3 hover:bg-gray-800/50 cursor-pointer flex justify-between items-center" onclick="viewRunLogs('${r.id}','${r.repo}')">
        <div>
          <span class="font-medium text-sm">${r.repo}</span>
          ${r.prNumber?'<span class="text-gray-500 text-xs ml-1">#'+r.prNumber+'</span>':''}
          <div class="text-xs text-gray-600">${new Date(r.startedAt).toLocaleString()}</div>
        </div>
        <span class="px-2 py-0.5 rounded text-xs font-medium ${sc} ${sb}">${st}${r.status==='in_progress'?' <span class="loader" style="width:12px;height:12px;border-width:2px"></span>':''}</span>
      </div>`;
    }).join('');
  }catch{}
}

async function viewRunLogs(runId, repo){
  document.getElementById('selected-run-title').textContent=`Logs: ${repo} (${runId})`;
  const container=document.getElementById('selected-run-logs');
  container.innerHTML='<p class="text-gray-500">Loading...</p>';
  try{
    const data=await api(`/runs/${runId}/logs`);
    container.innerHTML=data.logs.map(l=>`<div class="log-line${l.includes('[ERR]')?' log-err':''}">${l}</div>`).join('');
    container.scrollTop=container.scrollHeight;
  }catch{container.innerHTML='<p class="text-red-400">Failed to load logs</p>';}
}

loadRepos();
setInterval(loadRuns,5000);
</script>
</body>
</html>
