name: Automated Mobile Testing Bot

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (owner/name)'
        required: true
      pr_number:
        description: 'PR number (0 for full test)'
        required: false
        default: '0'
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'

env:
  NODE_ENV: production

jobs:
  test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout bot code (this repo) ──
      - name: Checkout bot
        uses: actions/checkout@v4
        with:
          path: bot

      # ── 2. Parse target repo input ──
      - name: Parse repo input
        id: parse-repo
        run: |
          IFS='/' read -r owner repo <<< "${{ github.event.inputs.repo }}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      # ── 3. Generate token for target repo ──
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          repositories: ${{ steps.parse-repo.outputs.repo }}

      # ── 3. Checkout target repo ──
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          path: target

      # ── 4. Setup environment ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Setup Java (for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby (for CocoaPods)
        if: hashFiles('target/Podfile') != '' || hashFiles('target/ios/Podfile') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Flutter (if needed)
        run: |
          if [ -f "target/pubspec.yaml" ]; then
            git clone --depth 1 --branch 3.24.0 https://github.com/flutter/flutter.git $HOME/flutter
            export PATH="$HOME/flutter/bin:$PATH"
            cd target && flutter pub get
          fi

      - name: Detect and prepare target app
        id: detect-app
        run: |
          echo "android=false" >> "$GITHUB_OUTPUT"
          echo "ios=false" >> "$GITHUB_OUTPUT"
          echo "framework=unknown" >> "$GITHUB_OUTPUT"

          # React Native
          if [ -f "target/package.json" ] && grep -q "react-native" target/package.json 2>/dev/null; then
            echo "framework=react-native" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Flutter
          if [ -f "target/pubspec.yaml" ]; then
            echo "framework=flutter" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Native Android (Kotlin/Java)
          if [ -f "target/build.gradle" ] || [ -f "target/build.gradle.kts" ] || [ -f "target/app/build.gradle" ] || [ -f "target/app/build.gradle.kts" ]; then
            echo "framework=kotlin" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

          # Native iOS (Swift)
          if ls target/*.xcodeproj 1>/dev/null 2>&1 || ls target/*.xcworkspace 1>/dev/null 2>&1; then
            echo "framework=swift" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Check subdirectories (1 level deep)
          for dir in target/*/; do
            if [ -f "${dir}build.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            fi
            if ls "${dir}"*.xcodeproj 1>/dev/null 2>&1 || ls "${dir}"*.xcworkspace 1>/dev/null 2>&1; then
              echo "ios=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # ── 5. Install & build bot ──
      - name: Install bot dependencies
        run: npm install --include=dev
        working-directory: bot

      - name: Build bot
        run: npm run build
        working-directory: bot

      - name: Run bot unit tests
        run: ./node_modules/.bin/jest --testPathIgnorePatterns=e2e
        working-directory: bot

      # ── 6. Validate required secrets ──
      - name: Validate secrets
        run: |
          missing=""
          [ -z "$BROWSERSTACK_USERNAME" ] && missing="$missing BROWSERSTACK_USERNAME"
          [ -z "$BROWSERSTACK_ACCESS_KEY" ] && missing="$missing BROWSERSTACK_ACCESS_KEY"
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="$missing CLAUDE_AUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}

      # ── 7. Run the bot against target repo ──
      - name: Run Automated Testing Bot
        run: |
          PR_NUM="${{ github.event.inputs.pr_number || '0' }}"
          node dist/index.js "$PR_NUM"
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.generate-token.outputs.installation-id }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
          TARGET_PATH: ${{ github.workspace }}/target
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}

      # ── 7. Upload artifacts ──
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            bot/step-definitions/
            bot/test-results/
          retention-days: 30

      # ── 8. Comment on target repo PR ──
      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}') || 0;
            if (!prNumber) { console.log('No PR number, skipping comment'); return; }

            const [owner, repo] = '${{ github.event.inputs.repo }}'.split('/');
            let comment = '## 🤖 Automated Mobile Testing Bot Results\n\n';
            const summaryPath = '${{ github.workspace }}/bot/test-results/summary.md';
            comment += fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf-8')
              : 'Test execution completed. Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.';

            await github.rest.issues.createComment({ issue_number: prNumber, owner, repo, body: comment });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}') || 0;
            if (!prNumber) { console.log('No PR number, skipping comment'); return; }

            const [owner, repo] = '${{ github.event.inputs.repo }}'.split('/');
            await github.rest.issues.createComment({
              issue_number: prNumber, owner, repo,
              body: '❌ Automated Mobile Testing Bot failed. Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
