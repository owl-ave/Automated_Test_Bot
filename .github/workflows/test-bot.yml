name: Automated Mobile Testing Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (owner/name)'
        required: true
      pr_number:
        description: 'PR number (0 for full test)'
        required: false
        default: '0'
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'

env:
  NODE_ENV: production

jobs:
  test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java (for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.0.10957337'

      - name: Setup Flutter (if needed)
        run: |
          if [ -f "pubspec.yaml" ]; then
            git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
            export PATH="$HOME/flutter/bin:$PATH"
            flutter pub get
          fi

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Automated Testing Bot
        run: |
          PR_NUM="${{ github.event.pull_request.number || github.event.inputs.pr_number || '0' }}"
          npm run start -- "$PR_NUM"
        env:
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.generate-token.outputs.installation-id }}
          GITHUB_REPOSITORY: ${{ github.event.inputs.repo || github.repository }}
          GITHUB_HEAD_REF: ${{ github.event.inputs.branch || github.head_ref || 'main' }}
          CLAUDE_AUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
          DEBUG: ${{ secrets.DEBUG || 'false' }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            features/
            step-definitions/
            test-results/
          retention-days: 30

      - name: Comment on PR with results
        if: always() && (github.event.pull_request.number || github.event.inputs.pr_number != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number || parseInt(process.env.INPUT_PR_NUMBER);
            if (!prNumber) return;

            let comment = '## 🤖 Automated Mobile Testing Bot Results\n\n';
            if (fs.existsSync('test-results/summary.md')) {
              comment += fs.readFileSync('test-results/summary.md', 'utf-8');
            } else {
              comment += 'Test execution in progress or completed. Check workflow logs for details.';
            }

            const [owner, repo] = (process.env.GITHUB_REPOSITORY || context.repo.owner + '/' + context.repo.repo).split('/');
            await github.rest.issues.createComment({ issue_number: prNumber, owner, repo, body: comment });
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '0' }}

      - name: Notify on failure
        if: failure() && (github.event.pull_request.number || github.event.inputs.pr_number != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || parseInt(process.env.INPUT_PR_NUMBER);
            if (!prNumber) return;

            const [owner, repo] = (process.env.GITHUB_REPOSITORY || context.repo.owner + '/' + context.repo.repo).split('/');
            await github.rest.issues.createComment({
              issue_number: prNumber, owner, repo,
              body: '❌ Automated Mobile Testing Bot failed. Check the workflow logs for details.'
            });
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '0' }}
