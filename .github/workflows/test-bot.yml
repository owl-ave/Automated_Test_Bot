name: Automated Mobile Testing Bot
run-name: "test ${{ inputs.repo }} @ ${{ inputs.branch }}${{ inputs.pr_number != '0' && format(' PR#{0}', inputs.pr_number) || '' }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (owner/name)'
        required: true
      pr_number:
        description: 'PR number (0 for full test)'
        required: false
        default: '0'
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'

env:
  NODE_ENV: production

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: test-bot-${{ github.event.inputs.repo }}-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # ── Detect target app platform ──
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.parse-repo.outputs.owner }}
      repo: ${{ steps.parse-repo.outputs.repo }}
      framework: ${{ steps.detect-app.outputs.framework }}
      needs_android: ${{ steps.detect-app.outputs.android }}
      needs_ios: ${{ steps.detect-app.outputs.ios }}
    steps:
      - name: Parse repo input
        id: parse-repo
        run: |
          IFS='/' read -r owner repo <<< "${{ github.event.inputs.repo }}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          repositories: ${{ steps.parse-repo.outputs.repo }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.pr_number != '0' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.event.inputs.branch }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1
          path: target

      - name: Detect target app platform
        id: detect-app
        run: |
          echo "android=false" >> "$GITHUB_OUTPUT"
          echo "ios=false" >> "$GITHUB_OUTPUT"
          echo "framework=unknown" >> "$GITHUB_OUTPUT"

          # React Native
          if [ -f "target/package.json" ] && grep -q "react-native" target/package.json 2>/dev/null; then
            echo "framework=react-native" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Flutter
          if [ -f "target/pubspec.yaml" ]; then
            echo "framework=flutter" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Native Android (Kotlin/Java)
          if [ -f "target/build.gradle" ] || [ -f "target/build.gradle.kts" ] || [ -f "target/app/build.gradle" ] || [ -f "target/app/build.gradle.kts" ]; then
            echo "framework=kotlin" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

          # Native iOS (Swift) — use find to handle xcodeproj/xcworkspace at any depth ≤ 3
          if find target -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) 2>/dev/null | grep -q .; then
            echo "framework=swift" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

          # Check subdirectories (1 level deep) for Android
          for dir in target/*/; do
            if [ -f "${dir}build.gradle" ] || [ -f "${dir}build.gradle.kts" ]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # ── Main pipeline — uses macOS for iOS, ubuntu for Android-only ──
  test-bot:
    needs: detect
    runs-on: ${{ needs.detect.outputs.needs_ios == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 120

    steps:
      # ── 1. Checkout bot code (this repo) ──
      - name: Checkout bot
        uses: actions/checkout@v4
        with:
          path: bot

      # ── 2. Generate token for target repo ──
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.detect.outputs.owner }}
          repositories: ${{ needs.detect.outputs.repo }}

      # ── 3. Checkout target repo ──
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.pr_number != '0' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.event.inputs.branch }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1
          path: target

      # ── 4. Setup environment ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Setup Java (for Android builds)
        if: needs.detect.outputs.needs_android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby (for CocoaPods)
        if: hashFiles('target/Podfile') != '' || hashFiles('target/ios/Podfile') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Select Xcode 26.2
        if: needs.detect.outputs.needs_ios == 'true'
        run: |
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            echo "::warning::Xcode 26.2 not found on runner; falling back to default"
            ls /Applications | grep -i '^Xcode' || true
          fi
          xcodebuild -version

      - name: Cache CocoaPods
        if: needs.detect.outputs.needs_ios == 'true'
        uses: actions/cache@v4
        with:
          path: |
            target/Pods
            target/ios/Pods
          key: pods-${{ hashFiles('target/Podfile.lock', 'target/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Cache Swift Package Manager
        if: needs.detect.outputs.needs_ios == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            target/ios/build/SourcePackages
            target/build/SourcePackages
          key: spm-${{ hashFiles('target/**/Package.resolved') }}
          restore-keys: spm-

      - name: Install CocoaPods
        if: needs.detect.outputs.needs_ios == 'true'
        run: |
          PODFILE=""
          [ -f "target/Podfile" ] && PODFILE="target"
          [ -f "target/ios/Podfile" ] && PODFILE="target/ios"
          if [ -n "$PODFILE" ]; then
            cd "$PODFILE" && pod install
          fi

      - name: Setup Flutter (if needed)
        if: hashFiles('target/pubspec.yaml') != ''
        run: |
          git clone --depth 1 --branch 3.24.0 https://github.com/flutter/flutter.git $HOME/flutter
          export PATH="$HOME/flutter/bin:$PATH"
          cd target && flutter pub get

      # ── 5. Install & build bot ──
      - name: Install bot dependencies
        run: npm install --include=dev
        working-directory: bot

      - name: Build bot
        run: npm run build
        working-directory: bot

      - name: Run bot unit tests
        run: ./node_modules/.bin/jest --testPathIgnorePatterns=e2e
        working-directory: bot

      # ── 6. Validate required secrets ──
      - name: Validate secrets
        run: |
          missing=""
          [ -z "$BROWSERSTACK_USERNAME" ] && missing="$missing BROWSERSTACK_USERNAME"
          [ -z "$BROWSERSTACK_ACCESS_KEY" ] && missing="$missing BROWSERSTACK_ACCESS_KEY"
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="$missing CLAUDE_AUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}

      # ── 7. Run the bot against target repo ──
      - name: Run Automated Testing Bot
        run: |
          PR_NUM="${{ github.event.inputs.pr_number || '0' }}"
          node dist/index.js "$PR_NUM"
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.generate-token.outputs.installation-id }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
          # When testing a specific PR, leave TARGET_BRANCH empty so the pipeline fetches
          # the real head branch from the GitHub API (pr.head.ref). Only pass the branch
          # input when running against a branch directly (pr_number == 0).
          TARGET_BRANCH: ${{ github.event.inputs.pr_number == '0' && github.event.inputs.branch || '' }}
          TARGET_PATH: ${{ github.workspace }}/target
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_AUTH_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}

      # ── 8. Upload artifacts ──
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: |
            bot/step-definitions/
            bot/test-results/
          retention-days: 30

      # ── 9. Refresh token (original may have expired after 1h+ pipeline) ──
      - name: Refresh GitHub App Token
        if: always()
        id: refresh-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.detect.outputs.owner }}
          repositories: ${{ needs.detect.outputs.repo }}

      # ── 10. Comment on target repo PR ──
      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.refresh-token.outputs.token }}
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}') || 0;
            if (!prNumber) { console.log('No PR number, skipping comment'); return; }

            const [owner, repo] = '${{ github.event.inputs.repo }}'.split('/');
            let comment = '## 🤖 Automated Mobile Testing Bot Results\n\n';
            const summaryPath = '${{ github.workspace }}/bot/test-results/summary.md';
            comment += fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf-8')
              : 'Test execution completed. Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.';

            await github.rest.issues.createComment({ issue_number: prNumber, owner, repo, body: comment });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.refresh-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}') || 0;
            if (!prNumber) { console.log('No PR number, skipping comment'); return; }

            const [owner, repo] = '${{ github.event.inputs.repo }}'.split('/');
            await github.rest.issues.createComment({
              issue_number: prNumber, owner, repo,
              body: '❌ Automated Mobile Testing Bot failed. Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
